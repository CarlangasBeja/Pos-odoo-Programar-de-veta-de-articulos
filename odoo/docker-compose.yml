# Odoo 20 Community + PostgreSQL para el POS Web (.NET).
# Uso normal: ejecute odoo/setup.ps1 (Windows) o odoo/setup.sh (Linux/macOS), que levantan esto y lo configuran.
#
#   docker compose -f odoo/docker-compose.yml up -d      # iniciar
#   docker compose -f odoo/docker-compose.yml down       # detener (los datos se conservan en los volúmenes)
#   docker compose -f odoo/docker-compose.yml down -v    # detener y BORRAR todos los datos
name: pos-odoo20

services:
  db:
    image: postgres:16
    # Docker da solo 64 MB de memoria compartida (/dev/shm). Las consultas en paralelo sobre un millón de filas la
    # agotan ("could not resize shared memory segment ... No space left on device") y Odoo responde con error.
    shm_size: 1gb
    # Ajustes para un millón de registros (los valores por defecto de PostgreSQL son mínimos: 128 MB de caché).
    # jit=off: con consultas cortas del POS, la compilación JIT agrega latencia en lugar de ahorrarla.
    command: >-
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c jit=off
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - pos-odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      # Variables estándar de PostgreSQL: así también los comandos "docker compose exec odoo odoo ..." encuentran la base.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    # --workers: varios procesos atienden consultas en paralelo (con 0, Odoo usa un solo proceso y las consultas de
    # varias cajas se atienden casi en fila). Ver docs/RENDIMIENTO_Y_RED.md.
    command: ["odoo", "--db-filter=^${ODOO_DB_NAME:-pos}$$", "--workers=${ODOO_WORKERS:-4}", "--max-cron-threads=1"]
    volumes:
      - pos-odoo-data:/var/lib/odoo
      # Scripts de preparación disponibles dentro del contenedor (solo lectura).
      - ./:/opt/pos-setup:ro
    restart: unless-stopped

volumes:
  pos-odoo-db:
  pos-odoo-data:
